name: Apply Internal Render Scale v1

on:
  push:
    branches:
      - audio-wave-vfx-v1
    paths:
      - tools/apply-render-scale-v1.py
      - .github/workflows/apply-render-scale-v1.yaml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audio-wave-vfx-v1
          fetch-depth: 0

      - name: Apply guarded migration
        run: python3 tools/apply-render-scale-v1.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio-shader-source.cpp src/includes/audio-shader-source.hpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add Internal Render Scale"
          git push origin HEAD:audio-wave-vfx-v1
