name: Fix Shader Diagnostics Migration Matcher

on:
  push:
    branches:
      - audio-wave-vfx-v1
    paths:
      - .github/workflows/fix-shader-diagnostics-migration.yaml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-wave-vfx-v1
          fetch-depth: 0
      - name: Fix matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-shader-diagnostics-v1.py')
          s = p.read_text()
          old = '    "\\t\\t\\t\\tBLOG(LOG_ERROR, \\\"Effect \'%s\' has no Draw, Solid, or Default technique\\\", s->effect_path.c_str());\\n",\n'
          new = '    "\\t\\t\\tBLOG(LOG_ERROR, \\\"Effect \'%s\' has no Draw, Solid, or Default technique\\\", s->effect_path.c_str());\\n",\n'
          if old not in s:
              raise SystemExit('matcher literal not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply-shader-diagnostics-v1.py
          git commit -m "Fix shader diagnostics migration matcher"
          git push origin HEAD:audio-wave-vfx-v1
