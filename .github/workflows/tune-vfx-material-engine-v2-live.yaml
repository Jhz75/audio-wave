name: Tune VFX Material Engine v2 Live

on:
  push:
    branches:
      - vfx-material-engine-v2
    paths:
      - tools/tune-vfx-material-engine-v2-live.py
      - .github/workflows/tune-vfx-material-engine-v2-live.yaml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vfx-material-engine-v2
          fetch-depth: 0
      - name: Apply live-performance gate
        run: python3 tools/tune-vfx-material-engine-v2-live.py
      - name: Commit shader tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/effects/vfx-material-engine-v2-pbr-sphere.effect
          git diff --cached --quiet && exit 0
          git commit -m "Tune Material Engine v2 shader for live performance"
          git push
